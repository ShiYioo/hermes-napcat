name: napcat-platform
label: NapCat (QQ)
kind: platform
version: 0.1.0
description: >
  NapCat (QQ / OneBot v11) platform adapter and toolset for Hermes Agent.
  Chat with your agent over QQ private chats and groups, and give it tools
  to proactively send messages and files, inspect groups, and perform
  moderation. Requires a running NapCat instance with a forward WebSocket.
requires_env:
  - name: NAPCAT_WS_URL
    description: NapCat forward WebSocket URL (e.g. ws://127.0.0.1:3001)
optional_env:
  - name: NAPCAT_TOKEN
    description: OneBot access token configured in NapCat (secret)
    secret: true
  - name: NAPCAT_ALLOWED_USERS
    description: Comma-separated QQ numbers allowed to talk to the agent
  - name: NAPCAT_ALLOW_ALL_USERS
    description: Set to 1/true to let any user talk to the agent (default off)
  - name: NAPCAT_HOME_CHANNEL
    description: Default chat id for cron/notification delivery (QQ number or g<group_id>)
  - name: NAPCAT_GROUP_ALL_MESSAGES
    description: Set to 1/true to respond to all group messages, not just @mentions
provides_tools:
  - napcat_send_message
  - napcat_send_file
  - napcat_get_group_list
  - napcat_get_group_member_info
  - napcat_group_mute
  - napcat_group_kick
